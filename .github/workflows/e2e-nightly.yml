# Nightly customer-path E2E.
#
# Runs the Playwright smoke + visual suite (tests/e2e) against a deployed
# preview/prod URL once a night, plus on-demand.
#
# 2026-09-21 — THIS WORKFLOW USED TO LIE.
#
# The header here previously described self-skipping as a feature: "the specs
# SELF-SKIP when their env tier isn't configured ... so this never false-reds".
# What that produced in practice: E2E_PREVIEW_URL, E2E_SESSION_COOKIE and
# E2E_WORKSPACE_ID have NEVER existed as repository secrets (verified by
# presence probe, 2026-09-21), so E2E_BASE_URL resolved empty, every spec
# skipped, Playwright exited 0, and this job reported success on its last five
# runs while testing precisely nothing.
#
# That is the same defect that hid 140 failed production deploys: a pipeline
# that passes while unable to do its job. rls-live.yml already learned it the
# hard way ("no database, so it reported exit 0 - 5,928 tests, 0 fail, and that
# line among the 21 skips") and was fixed by giving it a real database. This is
# that fix, applied here.
#
# Two guards now stand between this workflow and a false green:
#
#   1. Preflight. No E2E_BASE_URL -> FAIL immediately, naming what is missing.
#      This job is RED until its secrets exist, which is the honest state.
#   2. Evidence. After the run, scripts/ops/assert-e2e-executed.mjs asserts
#      that a non-zero number of specs actually executed. This catches the
#      general case: a base URL that is set but resolves to a suite where
#      everything still skips.
#
# An unreadable report is treated as INCONCLUSIVE and fails, never as a pass.
#
# On failure it runs scripts/playwright-failures-to-inbox.ts, which renders
# audit-queue entries. In CI the local autofire INBOX is unreachable, so those
# entries land in the job summary + an artifact for visibility. The LOCAL
# audit-queue-seeder (run on a 30-min cadence) independently catches THIS run's
# failure via the GitHub Actions API and writes it to the real INBOX. See
# docs/e2e/README.md.

name: e2e-nightly

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC ≈ 03:00/04:00 ET, before the morning autofire
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override E2E_BASE_URL (else uses the E2E_PREVIEW_URL secret/var)"
        required: false
        type: string

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Preflight — a target URL must exist
        env:
          RESOLVED: ${{ github.event.inputs.base_url || secrets.E2E_PREVIEW_URL || vars.E2E_PREVIEW_URL }}
          CONTROL: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CONTROL" ]; then
            echo "::error::GITHUB_TOKEN control is empty — the secrets context is not"
            echo "::error::behaving as expected. INCONCLUSIVE, not a pass."
            exit 1
          fi
          if [ -z "$RESOLVED" ]; then
            echo "::error::No E2E target URL. Every spec would self-skip and this job"
            echo "::error::would report success while testing nothing."
            echo "::error::Set the E2E_PREVIEW_URL repository secret (or the repo variable,"
            echo "::error::or pass base_url via workflow_dispatch)."
            echo "::error::Declared in ops/key-registry.yaml. Verified absent 2026-09-21."
            exit 1
          fi
          echo "E2E target is configured."

      - name: Run E2E suite
        env:
          CI: "1"
          # Resolution order: dispatch input → secret → repo var. Unset → specs skip.
          E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_PREVIEW_URL || vars.E2E_PREVIEW_URL }}
          # Optional authed tier — only set these if you've provisioned a seeded
          # workspace + sealed session for the target deployment.
          E2E_WORKSPACE_ID: ${{ secrets.E2E_WORKSPACE_ID }}
          E2E_SESSION_COOKIE: ${{ secrets.E2E_SESSION_COOKIE }}
          E2E_AUTH_FLOW: ${{ vars.E2E_AUTH_FLOW }}
        run: npm run test:e2e:nightly
      # A pass must be backed by a count of work done. Runs even when the
      # suite failed, so "0 executed" is never mistaken for "all green".
      - name: Evidence — specs actually executed
        if: always()
        run: node scripts/ops/assert-e2e-executed.mjs

      - name: Seed audit-queue from failures
        if: failure()
        env:
          PLAYWRIGHT_JSON_REPORT: playwright-report/results.json
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: npx tsx scripts/playwright-failures-to-inbox.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload seeded audit-queue entries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-queue-seeded
          path: audit-queue/
          retention-days: 14
          if-no-files-found: ignore
