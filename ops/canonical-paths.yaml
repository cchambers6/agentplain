# Canonical-path registry (M4, prevention architecture 2026-08-09).
#
# Every logical store the ops scripts touch is named here with its absolute
# path, a liveness TELL that must pass before the path may be used, and the
# known-bad decoys that produced the 2026-08-09 audit's wrong-store errors.
# Scripts resolve paths ONLY through scripts/ops/resolve-store.mjs — falling
# into the dual-store trap now requires ignoring a hard error, not merely
# following stale instructions.
#
# If the agent-mode session GUID changes, the tell fails, every ops script
# exits 2, the heartbeat publish fails, and M1 goes red within 2 h. A stale
# registry produces a visible outage, never a silent wrong read. Fix = update
# this file in a PR.

agent_store:
  path: 'C:\Users\conne\AppData\Roaming\Claude\local-agent-mode-sessions\e96926c9-f6b4-447c-b651-556629bc1f98\3e6a77a8-104b-4774-8239-85aac4c3463b\agent\memory'
  aliases: # same directory via the Windows Store redirect — valid
    - 'C:\Users\conne\AppData\Local\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\local-agent-mode-sessions\e96926c9-f6b4-447c-b651-556629bc1f98\3e6a77a8-104b-4774-8239-85aac4c3463b\agent\memory'
  tell: { file: INBOX.md, pattern: '\[PROCESSED', min_count: 40 }
